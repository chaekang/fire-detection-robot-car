linecap="round" /><polygon points="1050.00,580.00 1039.00,575.00 1039.00,585.00" fill="#0F766E" /><polyline points="920,465 970,465 970,720 1050,720" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polygon points="1050.00,720.00 1039.00,715.00 1039.00,725.00" fill="#0F766E" /><polyline points="635,780 635,930" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><polygon points="635.00,930.00 640.00,919.00 630.00,919.00" fill="#2563EB" /><polyline points="835,930 835,780" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><polygon points="835.00,780.00 830.00,791.00 840.00,791.00" fill="#16A34A" /><text x="50" y="55" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">삐송삐송  |  시스템 아키텍처</text><text x="50" y="103" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start" dominant-baseline="central">센서 입력과 주행 제어는 Raspberry Pi에서, 영상 판정은 별도 PC에서 수행합니다.</text><text x="80" y="190" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" fill="#334155" text-anchor="start" dominant-baseline="central">01   센서 입력</text><text x="550" y="190" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" fill="#1E40AF" text-anchor="start" dominant-baseline="central">02   Raspberry Pi</text><text x="1050" y="190" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" fill="#115E59" text-anchor="start" dominant-baseline="central">03   장치 출력</text><text x="235" y="251" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">라인 IR 센서 × 4</text><text x="235" y="278" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">검은 선 감지 조합</text><text x="235" y="301" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="central">GPIO</text><text x="235" y="371" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">초음파 거리 센서</text><text x="235" y="398" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">전방 장애물 거리</text><text x="235" y="421" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="central">GPIO · TRIG / ECHO</text><text x="235" y="491" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">좌우 장애물 IR</text><text x="235" y="518" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">회피 방향 결정에 사용</text><text x="235" y="541" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="central">GPIO</text><text x="235" y="611" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">MPU6050 IMU</text><text x="235" y="638" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">자이로 Z축 → yaw 추정</text><text x="235" y="661" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="central">I2C</text><text x="235" y="731" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Raspberry Pi 카메라</text><text x="235" y="758" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">RGB 프레임 640 × 480</text><text x="235" y="781" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="central">Picamera2</text><text x="735" y="275" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="700" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">주행 · 상태 제어</text><text x="735" y="307" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="central">src/main.py</text><text x="735" y="357" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">거리 확인 및 라인 추종</text><text x="735" y="404" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">장애물 분류와 회피</text><text x="735" y="451" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">화재 감지 시 정지 · 대기</text><text x="735" y="498" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">OLED · LED · 버저 상태 표시</text><text x="735" y="707" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">영상 전송 클라이언트</text><text x="735" y="737" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">Picamera2 → JPEG → TCP</text><text x="735" y="763" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle" dominant-baseline="central">src/fire_detection.py</text><text x="1205" y="258" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#134E4A" text-anchor="middle" dominant-baseline="central">STM8 제어 보드</text><text x="1205" y="293" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">I2C 명령 수신</text><text x="1205" y="421" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="700" fill="#134E4A" text-anchor="middle" dominant-baseline="central">DC 모터 · 카메라 서보</text><text x="1205" y="455" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">주행 / 카메라 방향</text><text x="1205" y="564" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#134E4A" text-anchor="middle" dominant-baseline="central">SSD1306 OLED</text><text x="1205" y="599" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">표정과 상태 표시</text><text x="1205" y="704" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#134E4A" text-anchor="middle" dominant-baseline="central">LED · 버저</text><text x="1205" y="739" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="central">점멸과 음향 알림</text><text x="550" y="959" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="start" dominant-baseline="central">04   별도 PC</text><text x="735" y="996" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="700" fill="#4C1D95" text-anchor="middle" dominant-baseline="central">YOLOv8 화재 판정 서버</text><text x="735" y="1035" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="400" fill="#6D28D9" text-anchor="middle" dominant-baseline="central">서버 소스와 모델은 저장소에 미포함</text><rect x="552.0" y="582" width="86.0" height="32" rx="4" fill="#EFF6FF" /><text x="595" y="598" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle" dominant-baseline="central">판정 요청</text><rect x="822.0" y="616" width="86.0" height="32" rx="4" fill="#EFF6FF" /><text x="865" y="632" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="middle" dominant-baseline="central">감지 여부</text><text x="984" y="270" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle" dominant-baseline="central">I2C</text><text x="1263" y="358" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="400" fill="#0F766E" text-anchor="middle" dominant-baseline="central">구동 명령</text><text x="1018" y="563" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#0F766E" text-anchor="middle" dominant-baseline="central">I2C</text><text x="995" y="700" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#0F766E" text-anchor="middle" dominant-baseline="central">GPIO / PWM</text><rect x="541.75390625" y="860" width="156.4921875" height="32" rx="4" fill="#FFFFFF" /><text x="620" y="876" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle" dominant-baseline="central">TCP · JPEG 프레임</text><rect x="760.25390625" y="831" width="211.4921875" height="32" rx="4" fill="#FFFFFF" /><text x="866" y="847" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="middle" dominant-baseline="central">TCP · 판정 결과 "1" / "0"</text></svg>