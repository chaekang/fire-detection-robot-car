<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc"><title id="title">삐송삐송 시스템 아키텍처</title><desc id="desc">센서 입력은 라즈베리파이의 주행 제어로 연결되고 카메라 프레임은 별도 PC에서 판정된다. 라즈베리파이는 STM8 보드, OLED, LED와 버저를 제어한다.</desc><rect width="1440" height="1110" fill="#FFFFFF" /><rect x="50" y="150" width="370" height="680" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" /><rect x="520" y="150" width="430" height="680" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" /><rect x="1020" y="150" width="370" height="680" rx="16" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5" /><rect x="80" y="225" width="310" height="90" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" /><rect x="80" y="345" width="310" height="90" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" /><rect x="80" y="465" width="310" height="90" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" /><rect x="80" y="585" width="310" height="90" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" /><rect x="80" y="705" width="310" height="90" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" /><rect x="550" y="240" width="370" height="300" rx="16" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2" /><rect x="550" y="680" width="370" height="100" rx="16" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2" /><rect x="1050" y="225" width="310" height="100" rx="12" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.5" /><rect x="1050" y="390" width="310" height="95" rx="12" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.5" /><rect x="1050" y="535" width="310" height="90" rx="12" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.5" /><rect x="1050" y="675" width="310" height="90" rx="12" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.5" /><rect x="520" y="930" width="430" height="135" rx="16" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2" /><polyline points="390,270 450,270 450,285 550,285" fill="none" st